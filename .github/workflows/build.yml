name: Build SecondScreen ISO

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      APORTS_REF: v3.20.0
      ISO_TAG: dev
    steps:
      - uses: actions/checkout@v4

      # Pull Alpine explicitly so pull failures (e.g. Docker Hub anonymous
      # rate limits on shared runners) are visible in their own step.
      # public.ecr.aws mirrors the Docker Hub library and is rate-limit free.
      - name: Pull Alpine image
        run: |
          set -x
          docker info --format '{{.ServerVersion}}'
          if ! docker pull alpine:3.20; then
            echo "Docker Hub pull failed - falling back to public.ecr.aws mirror"
            docker pull public.ecr.aws/docker/library/alpine:3.20
            docker tag public.ecr.aws/docker/library/alpine:3.20 alpine:3.20
          fi

      # The build must run inside Alpine (apk, abuild, mkimage). JS-based
      # actions don't work in Alpine containers (musl), so the Alpine side
      # runs via plain `docker run` on the Ubuntu runner instead.
      #
      # The container is named so later steps can read its full stdout
      # (docker logs) even when this step fails.
      - name: Build ISO + flashable image inside Alpine container
        run: |
          docker run --name ssbuild \
            -v "$PWD":/project \
            -e APORTS_REF \
            -e ISO_TAG \
            -e PROJECT_DIR=/project \
            -e OUTDIR=/project/out \
            alpine:3.20 \
            sh /project/build/mkprofile.sh
          rc=$?
          echo "BUILD_EXIT=$rc"
          exit $rc

      # Full build output lands in the job summary, which is readable on
      # the public run page without any authentication.
      - name: Publish build log to job summary
        if: always()
        run: |
          {
            echo '### SecondScreen build output'
            echo '```'
            docker logs ssbuild 2>&1 || echo '(container gone - see step above)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Also post the tail of the build output to a GitHub issue: issue
      # comments are readable via the unauthenticated API, unlike job logs.
      - name: Post build log to debug issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker logs ssbuild > build-output.txt 2>&1 || true
          {
            echo "Run: ${{ github.run_id }} commit: ${{ github.sha }}"
            echo '```'
            tail -n 200 build-output.txt
            echo '```'
          } > comment-body.md
          gh issue view 1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "CI debug log" --body "CI log thread" || true
          gh issue comment 1 -R "$GITHUB_REPOSITORY" --body-file comment-body.md || true
        continue-on-error: true

      - name: Remove build container
        if: always()
        run: docker rm -f ssbuild >/dev/null 2>&1 || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: secondscreen-iso
          path: |
            out/*.iso
            out/*.img
            out/*.sha256
          if-no-files-found: error
